name: Build DatAdmin (legacy .NET Framework)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable legacy .NET Framework 3.5 support
        shell: powershell
        run: |
          Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build original DatAdmin solution
        shell: pwsh
        run: |
          msbuild .\DatAdmin.sln `
            /t:Build `
            /m `
            /p:Configuration=Release `
            '/p:Platform=Any CPU' `
            /v:minimal `
            '/flp:logfile=msbuild.log;verbosity=diagnostic'

      - name: Upload build outputs and diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datadmin-build-diagnostics
          path: |
            msbuild.log
            **/bin/Release/**
          if-no-files-found: warn
          retention-days: 14
